<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nettoyeur de Commandes - V6 (Tableau & Excel)</title>
    
    <!-- Bibliothèque pour générer le fichier Excel (.xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; max-width: 1200px; margin: 40px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .instructions { background-color: #e8f4f8; padding: 15px; border-left: 4px solid #3498db; margin-bottom: 20px; border-radius: 0 4px 4px 0;}
        select, input[type="file"] { display: block; margin-top: 10px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; max-width: 400px;}
        
        button { background-color: #27ae60; color: white; border: none; padding: 12px 20px; font-size: 16px; cursor: pointer; border-radius: 4px; transition: background 0.3s; font-weight: bold; }
        button:hover { background-color: #2ecc71; }
        
        #step1-btn { width: 100%; max-width: 400px; margin-top: 15px; display: block; }
        #status { margin-top: 20px; font-weight: bold; text-align: center; }
        
        /* Zone Doublons */
        #conflict-zone { display: none; margin-top: 30px; border-top: 2px dashed #ccc; padding-top: 20px; }
        .conflict-item { background: #fff3cd; border-left: 4px solid #f39c12; margin-bottom: 20px; padding: 15px; border-radius: 4px; transition: all 0.3s; }
        .conflict-error { border: 2px solid #e74c3c; background-color: #fdf0ed; box-shadow: 0 0 10px rgba(231, 76, 60, 0.3);}
        .conflict-header { font-weight: bold; margin-bottom: 15px; color: #d35400; font-size: 16px; border-bottom: 1px solid #f39c12; padding-bottom: 10px;}
        .radio-group { display: flex; gap: 20px; margin-top: 10px; }
        .radio-label { cursor: pointer; padding: 8px 15px; background: white; border-radius: 20px; border: 1px solid #ccc; font-weight: normal; transition: 0.2s; }
        .radio-label:hover { background: #f1f2f6; }
        input[type="radio"] { transform: scale(1.2); margin-right: 8px; cursor: pointer; }
        
        .profiles { display: flex; gap: 20px; margin-top: 15px;}
        .profile-box { background: white; padding: 12px; border-radius: 4px; flex: 1; border: 1px solid #f1c40f; font-size: 14px; }
        .profile-box span { color: #7f8c8d; }

        /* Zone Tableau Final */
        #table-zone { display: none; margin-top: 30px; border-top: 2px solid #2ecc71; padding-top: 20px; }
        .action-buttons { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn-back { background-color: #95a5a6; }
        .btn-back:hover { background-color: #7f8c8d; }
        .btn-csv { background-color: #34495e; }
        .btn-csv:hover { background-color: #2c3e50; }
        .btn-excel { background-color: #107c41; } /* Vert Microsoft Excel */
        .btn-excel:hover { background-color: #0c5e31; }

        .table-container { overflow-x: auto; border-radius: 4px; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; background: white; white-space: nowrap; font-size: 14px; }
        th, td { padding: 10px 15px; border: 1px solid #eee; text-align: left; }
        th { background-color: #f8f9fa; color: #2c3e50; font-weight: bold; position: sticky; top: 0; }
        tbody tr:nth-child(even) { background-color: #f9fbfd; }
        tbody tr:hover { background-color: #f1f4f8; }
        
        .setup-zone { display: flex; flex-direction: column; align-items: center; }
    </style>
</head>
<body>

    <h1>Gestionnaire de Commandes</h1>
    
    <div class="instructions">
        <p><strong>1.</strong> Sélectionnez l'export brut. <strong>2.</strong> Traitez les doublons potentiels. <strong>3.</strong> Vérifiez le résultat en direct. <strong>4.</strong> Exportez en Excel !</p>
    </div>

    <div class="setup-zone">
        <select id="encoding">
            <option value="UTF-8">Encodage: UTF-8 (Standard)</option>
            <option value="windows-1252">Encodage: ANSI / Windows-1252</option>
        </select>
        
        <input type="file" id="fileInput" accept=".csv">
        <button id="step1-btn" onclick="processCSV()">Analyser le fichier</button>
    </div>

    <div id="status"></div>

    <!-- ZONE DOUBLONS -->
    <div id="conflict-zone">
        <h2>⚠️ Doublons probables détectés</h2>
        <p style="color: #e74c3c; font-weight: bold;">Veuillez répondre à toutes les propositions ci-dessous :</p>
        <div id="conflict-list"></div>
        <button onclick="finalizeAndShowTable()" style="background-color: #f39c12; font-size: 18px; padding: 15px;">Générer le tableau final</button>
    </div>

    <!-- ZONE TABLEAU ET EXPORT -->
    <div id="table-zone">
        <div class="action-buttons">
            <button id="btn-back" class="btn-back" onclick="returnToConflicts()">⬅️ Revenir au choix des doublons</button>
            <button class="btn-csv" onclick="downloadAsCSV()">📥 Télécharger CSV</button>
            <button class="btn-excel" onclick="downloadAsExcel()">📊 Télécharger EXCEL</button>
        </div>
        <div class="table-container">
            <table id="result-table"></table>
        </div>
    </div>

    <script>
        let globalGroups = [];
        let globalConflicts = [];
        let globalProducts = new Set();
        let finalDataAOA = []; // Stockera les données sous forme de tableau (Array of Arrays) pour Excel/CSV

        // Outils Mathématiques & Textes
        function levenshteinDistance(a, b) {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            let matrix = [];
            for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
            for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) { matrix[i][j] = matrix[i - 1][j - 1]; } 
                    else { matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1)); }
                }
            }
            return matrix[b.length][a.length];
        }

        function getSimilarity(s1, s2) {
            let maxLen = Math.max(s1.length, s2.length);
            if (maxLen === 0) return 1.0;
            let distance = levenshteinDistance(s1, s2);
            return (maxLen - distance) / maxLen;
        }

        function normalizeStr(str) {
            if (!str) return "";
            return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
        }

        function findKey(obj, possibleNames) {
            let keys = Object.keys(obj);
            for (let key of keys) {
                let keyNorm = normalizeStr(key);
                for (let name of possibleNames) {
                    if (keyNorm.includes(normalizeStr(name))) return key;
                }
            }
            return null;
        }

        function nettoyerNomProduit(nomBrut) {
            let nom = nomBrut.trim();
            if (nom.toUpperCase().startsWith("SAUCISSON")) {
                let match = nom.match(/\(([^-\)]+)/);
                if (match) return match[1].trim();
            }
            return nom.split('(')[0].trim();
        }

        function parseCSVFull(text) {
            text = text.replace(/^\uFEFF/, ''); 
            let result = [];
            let headers = [];
            let curVal = '';
            let inQuotes = false;
            let row = [];

            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                let nextChar = text[i+1];
                if (char === '"') {
                    if (inQuotes && nextChar === '"') { curVal += '"'; i++; } 
                    else { inQuotes = !inQuotes; }
                } else if (char === ';' && !inQuotes) {
                    row.push(curVal.trim()); curVal = '';
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') i++;
                    row.push(curVal.trim());
                    if (headers.length === 0) { headers = row; } 
                    else if (row.join('') !== '') {
                        let obj = {};
                        headers.forEach((h, idx) => { obj[h] = row[idx] || ""; });
                        result.push(obj);
                    }
                    row = []; curVal = '';
                } else { curVal += char; }
            }
            if (curVal !== '' || row.length > 0) {
                row.push(curVal.trim());
                if (headers.length !== 0 && row.join('') !== '') {
                    let obj = {};
                    headers.forEach((h, idx) => { obj[h] = row[idx] || ""; });
                    result.push(obj);
                }
            }
            return result;
        }

        // ETAPE 1 : LECTURE DU FICHIER ET DETECTION
        function processCSV() {
            const fileInput = document.getElementById('fileInput');
            const encoding = document.getElementById('encoding').value;
            const statusDiv = document.getElementById('status');
            
            document.getElementById('conflict-zone').style.display = "none";
            document.getElementById('table-zone').style.display = "none";
            
            if (fileInput.files.length === 0) {
                statusDiv.innerText = "❌ Veuillez sélectionner un fichier.";
                return;
            }

            statusDiv.innerText = "Analyse en cours...";
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const rows = parseCSVFull(e.target.result);
                    if (rows.length === 0) throw new Error("Fichier vide ou mal formaté.");

                    const sampleRow = rows[0];
                    const hMap = {
                        article: findKey(sampleRow, ["article", "souscat"]),
                        tarif: findKey(sampleRow, ["tarif", "prix"]),
                        email: findKey(sampleRow, ["emailacheteur", "email", "mail"]),
                        nomAcheteur: findKey(sampleRow, ["nomparticipant", "nomacheteur"]),
                        prenomAcheteur: findKey(sampleRow, ["prenomparticipant", "prenomacheteur"]),
                        mobile: findKey(sampleRow, ["mobile", "telephone", "gsm"]),
                        classe: findKey(sampleRow, ["classe", "frequente"]),
                        prenomEnfant: findKey(sampleRow, ["prenomdevotre", "prenomenfant"]), 
                        nomEnfant: findKey(sampleRow, ["nomdevotre", "nomenfant"])
                    };

                    let rawGroups = {};
                    globalProducts = new Set();

                    rows.forEach(row => {
                        let prodBrut = hMap.article ? row[hMap.article] : "";
                        if (!prodBrut) {
                            if (hMap.tarif && /[a-zA-Z]/.test(row[hMap.tarif])) prodBrut = row[hMap.tarif];
                        }
                        if (!prodBrut) {
                            for (let key in row) {
                                let val = row[key];
                                if (typeof val === 'string' && val.length > 5) {
                                    let vUp = val.toUpperCase();
                                    if (vUp.includes("SAUCISSON") || vUp.includes("TRIO") || vUp.includes("MAROILLES") || (vUp.startsWith("LA ") && vUp.includes("("))) {
                                        prodBrut = val; break;
                                    }
                                }
                            }
                        }
                        if (!prodBrut) return;

                        let produit = nettoyerNomProduit(prodBrut);
                        globalProducts.add(produit);

                        let email = hMap.email ? row[hMap.email] : "";
                        let nom = hMap.nomAcheteur ? row[hMap.nomAcheteur] : "";
                        let prenom = hMap.prenomAcheteur ? row[hMap.prenomAcheteur] : "";
                        let enfant = hMap.prenomEnfant ? row[hMap.prenomEnfant] : "";
                        
                        let strictKey = normalizeStr(`${email}_${nom}_${prenom}_${enfant}`);

                        if (!rawGroups[strictKey]) {
                            rawGroups[strictKey] = {
                                _id: strictKey,
                                identite: {
                                    "Nom participant": nom,
                                    "Prénom participant": prenom,
                                    "E-mail Acheteur": email,
                                    "Mobile Acheteur": hMap.mobile ? row[hMap.mobile] : "",
                                    "Quelle classe fréquente votre enfant?": hMap.classe ? row[hMap.classe] : "",
                                    "Prénom de votre enfant": enfant,
                                    "Nom de votre enfant": hMap.nomEnfant ? row[hMap.nomEnfant] : ""
                                },
                                produits: {}
                            };
                        }
                        if (!rawGroups[strictKey].produits[produit]) rawGroups[strictKey].produits[produit] = 0;
                        rawGroups[strictKey].produits[produit] += 1;
                    });

                    if (globalProducts.size === 0) throw new Error("Aucun article trouvé.");

                    globalGroups = Object.values(rawGroups);
                    globalConflicts = [];

                    // Recherche de similarités
                    for (let i = 0; i < globalGroups.length; i++) {
                        for (let j = i + 1; j < globalGroups.length; j++) {
                            let g1 = globalGroups[i].identite;
                            let g2 = globalGroups[j].identite;

                            let parent1 = normalizeStr(g1["Nom participant"] + g1["Prénom participant"] + g1["E-mail Acheteur"]);
                            let parent2 = normalizeStr(g2["Nom participant"] + g2["Prénom participant"] + g2["E-mail Acheteur"]);

                            if (parent1.length < 5 || parent2.length < 5) continue;

                            let sim = getSimilarity(parent1, parent2);
                            let sameChild = normalizeStr(g1["Prénom de votre enfant"]) === normalizeStr(g2["Prénom de votre enfant"]);

                            if ((sim > 0.85 && sim < 1.0) || (sim === 1.0 && !sameChild)) {
                                globalConflicts.push({ id1: i, id2: j, g1: g1, g2: g2 });
                            }
                        }
                    }

                    if (globalConflicts.length > 0) {
                        statusDiv.innerText = "";
                        let listHtml = "";
                        globalConflicts.forEach((c, idx) => {
                            listHtml += `
                            <div class="conflict-item" id="conflict_box_${idx}">
                                <div class="conflict-header">Voulez-vous fusionner ces deux commandes en une seule ?</div>
                                <div class="radio-group">
                                    <label class="radio-label">
                                        <input type="radio" name="conflict_${idx}" value="yes" onchange="clearError(${idx})"> ✅ Oui, c'est la même personne
                                    </label>
                                    <label class="radio-label">
                                        <input type="radio" name="conflict_${idx}" value="no" onchange="clearError(${idx})"> ❌ Non, ce sont 2 clients séparés
                                    </label>
                                </div>
                                <div class="profiles">
                                    <div class="profile-box">
                                        <b>${c.g1["Nom participant"]} ${c.g1["Prénom participant"]}</b><br>
                                        <span>📧</span> ${c.g1["E-mail Acheteur"] || 'N/A'}<br>
                                        <span>👶</span> ${c.g1["Prénom de votre enfant"] || 'Aucun enfant'} (Classe: ${c.g1["Quelle classe fréquente votre enfant?"] || 'N/A'})
                                    </div>
                                    <div class="profile-box">
                                        <b>${c.g2["Nom participant"]} ${c.g2["Prénom participant"]}</b><br>
                                        <span>📧</span> ${c.g2["E-mail Acheteur"] || 'N/A'}<br>
                                        <span>👶</span> ${c.g2["Prénom de votre enfant"] || 'Aucun enfant'} (Classe: ${c.g2["Quelle classe fréquente votre enfant?"] || 'N/A'})
                                    </div>
                                </div>
                            </div>`;
                        });
                        document.getElementById('conflict-list').innerHTML = listHtml;
                        document.getElementById('conflict-zone').style.display = "block";
                    } else {
                        // S'il n'y a aucun doublon à vérifier, on génère directement le tableau
                        statusDiv.innerText = "";
                        finalizeAndShowTable();
                    }

                } catch (err) {
                    statusDiv.innerText = "❌ Erreur : " + err.message;
                }
            };
            reader.readAsText(fileInput.files[0], encoding);
        }

        function clearError(idx) {
            document.getElementById(`conflict_box_${idx}`).classList.remove('conflict-error');
        }

        // Retour aux doublons si on veut changer d'avis
        function returnToConflicts() {
            document.getElementById('table-zone').style.display = "none";
            document.getElementById('conflict-zone').style.display = "block";
            // L'état des radios est conservé nativement par le navigateur
        }

        // ETAPE 2 : GENERATION DU TABLEAU EN DIRECT
        function finalizeAndShowTable() {
            // Validation des choix (seulement s'il y a des conflits)
            if (globalConflicts.length > 0) {
                for (let i = 0; i < globalConflicts.length; i++) {
                    let radios = document.getElementsByName(`conflict_${i}`);
                    let answered = false;
                    for (let r of radios) { if (r.checked) { answered = true; break; } }
                    
                    if (!answered) {
                        let box = document.getElementById(`conflict_box_${i}`);
                        box.classList.add('conflict-error');
                        box.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        alert("Attention : Vous devez choisir 'Oui' ou 'Non' pour chaque doublon !");
                        return;
                    }
                }
            }

            // Union-Find pour lier les groupes fusionnés
            let parentArr = Array.from({length: globalGroups.length}, (_, i) => i);
            function findRoot(i) {
                if (parentArr[i] === i) return i;
                return parentArr[i] = findRoot(parentArr[i]);
            }

            globalConflicts.forEach((c, idx) => {
                let choice = "no";
                let radios = document.getElementsByName(`conflict_${idx}`);
                for (let r of radios) { if (r.checked) choice = r.value; }

                if (choice === "yes") {
                    let root1 = findRoot(c.id1);
                    let root2 = findRoot(c.id2);
                    if (root1 !== root2) parentArr[root2] = root1; 
                }
            });

            // Construction de la donnée finale
            let finalGroups = {};
            globalGroups.forEach((group, idx) => {
                let rootId = findRoot(idx);
                if (!finalGroups[rootId]) {
                    finalGroups[rootId] = JSON.parse(JSON.stringify(group));
                } else {
                    let main = finalGroups[rootId];
                    let enf1 = main.identite["Prénom de votre enfant"];
                    let enf2 = group.identite["Prénom de votre enfant"];
                    if (enf2 && normalizeStr(enf1) !== normalizeStr(enf2)) {
                        main.identite["Prénom de votre enfant"] = enf1 ? enf1 + " & " + enf2 : enf2;
                    }
                    
                    let cls1 = main.identite["Quelle classe fréquente votre enfant?"];
                    let cls2 = group.identite["Quelle classe fréquente votre enfant?"];
                    if (cls2 && normalizeStr(cls1) !== normalizeStr(cls2)) {
                        main.identite["Quelle classe fréquente votre enfant?"] = cls1 ? cls1 + " & " + cls2 : cls2;
                    }

                    if ((group.identite["E-mail Acheteur"] || "").length > (main.identite["E-mail Acheteur"] || "").length) {
                        main.identite["E-mail Acheteur"] = group.identite["E-mail Acheteur"];
                    }
                    if ((group.identite["Mobile Acheteur"] || "").length > (main.identite["Mobile Acheteur"] || "").length) {
                        main.identite["Mobile Acheteur"] = group.identite["Mobile Acheteur"];
                    }

                    for (let p in group.produits) {
                        if (!main.produits[p]) main.produits[p] = 0;
                        main.produits[p] += group.produits[p];
                    }
                }
            });

            // Préparation des données pour le tableau (et l'export)
            finalDataAOA = [];
            let colonnesIdentite = [
                "Nom participant", "Prénom participant", "E-mail Acheteur", 
                "Mobile Acheteur", "Quelle classe fréquente votre enfant?", 
                "Prénom de votre enfant", "Nom de votre enfant"
            ];
            let listeProduits = Array.from(globalProducts);
            
            // Ligne d'en-tête
            let headers = [...colonnesIdentite, ...listeProduits];
            finalDataAOA.push(headers);

            // Remplissage lignes
            Object.values(finalGroups).forEach(client => {
                let row = [];
                colonnesIdentite.forEach(col => row.push(client.identite[col] || ""));
                listeProduits.forEach(prod => row.push(client.produits[prod] || 0));
                finalDataAOA.push(row);
            });

            // Rendu HTML du tableau
            let tableHTML = "<thead><tr>" + headers.map(h => `<th>${h}</th>`).join('') + "</tr></thead><tbody>";
            for (let i = 1; i < finalDataAOA.length; i++) {
                tableHTML += "<tr>" + finalDataAOA[i].map(val => `<td>${val}</td>`).join('') + "</tr>";
            }
            tableHTML += "</tbody>";

            document.getElementById('result-table').innerHTML = tableHTML;
            
            // Gérer l'affichage des zones
            document.getElementById('conflict-zone').style.display = "none";
            document.getElementById('table-zone').style.display = "block";
            
            // Afficher ou cacher le bouton "Retour" selon s'il y a eu des doublons ou non
            document.getElementById('btn-back').style.display = globalConflicts.length > 0 ? "inline-block" : "none";
            
            // Petit scroll automatique vers le tableau
            document.getElementById('table-zone').scrollIntoView({ behavior: 'smooth' });
        }

        // EXPORT CSV
        function downloadAsCSV() {
            let csvContent = "";
            finalDataAOA.forEach(row => {
                // Pour le CSV, il faut ajouter des guillemets autour du texte pour éviter que les ; cassent la structure
                let escapedRow = row.map(val => {
                    let str = String(val);
                    if (str.includes('"') || str.includes(';') || str.includes('\n')) {
                        return '"' + str.replace(/"/g, '""') + '"';
                    }
                    return str;
                });
                csvContent += escapedRow.join(";") + "\n";
            });

            let csvData = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
            let url = URL.createObjectURL(csvData);
            let link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "Commandes_Finales.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // EXPORT EXCEL (Nécessite la connexion Internet pour le script SheetJS)
        function downloadAsExcel() {
            if (typeof XLSX === 'undefined') {
                alert("❌ Erreur : Impossible de créer le fichier Excel. Vérifiez que vous êtes connecté à Internet (la fonction nécessite le chargement d'un script externe).");
                return;
            }
            
            // SheetJS convertit notre "Array of Arrays" en vraie feuille Excel
            var worksheet = XLSX.utils.aoa_to_sheet(finalDataAOA);
            var workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Commandes");
            
            // Téléchargement
            XLSX.writeFile(workbook, "Commandes_Finales.xlsx");
        }
    </script>
</body>
</html>
